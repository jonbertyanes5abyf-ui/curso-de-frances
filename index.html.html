<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curso de Francés · Personal</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#5d6475;--bd:#e2e5ee;--ac:#2549c9;--ac2:#e8edfd;--ok:#15803d;--okb:#e3f6e8;--no:#b91c1c;--nob:#fde8e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1219;--card:#181c26;--tx:#e8eaf0;--mu:#9aa2b5;--bd:#2a3040;--ac:#7c9bff;--ac2:#1d2744;--ok:#5fd68a;--okb:#14301f;--no:#ff8a8a;--nob:#3a1a1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1219;--card:#181c26;--tx:#e8eaf0;--mu:#9aa2b5;--bd:#2a3040;--ac:#7c9bff;--ac2:#1d2744;--ok:#5fd68a;--okb:#14301f;--no:#ff8a8a;--nob:#3a1a1a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:14px 20px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top{display:flex;align-items:center;gap:14px;max-width:1100px;margin:auto}
.logo{font-weight:700;font-size:18px}.logo span{color:var(--ac)}
.pb{flex:1;height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac);width:0;transition:width .4s}
.pt{font-size:13px;color:var(--mu);white-space:nowrap}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:20px;max-width:1100px;margin:20px auto;padding:0 16px}
nav{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;align-self:start}
nav h4{margin:6px 8px 10px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.mb{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:10px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
.mb:hover,.mb.on{background:var(--ac2)}.mb.on{font-weight:600}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:12px}
.mb.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
main{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:28px;min-width:0}
.tag{color:var(--ac);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
h1{margin:4px 0 18px;font-size:26px;line-height:1.25}
.box{background:var(--ac2);border-left:4px solid var(--ac);padding:12px 16px;border-radius:6px;margin:14px 0}
table{width:100%;border-collapse:collapse;margin:12px 0}td{padding:8px 10px;border-bottom:1px solid var(--bd)}td:first-child{width:55%}
.sp{background:var(--ac2);border:0;border-radius:50%;width:30px;height:30px;cursor:pointer;margin-right:6px}
.btn{background:var(--ac);color:#fff;border:0;padding:11px 20px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.btn.s{background:none;color:var(--ac);border:1px solid var(--ac)}.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.q{border:1px solid var(--bd);border-radius:10px;padding:16px;margin:14px 0}.q p{margin:0 0 10px;font-weight:600}
.o{display:block;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
.o:hover{background:var(--ac2)}.o input{margin-right:8px}
.o.ok{background:var(--okb);border-color:var(--ok)}.o.no{background:var(--nob);border-color:var(--no)}
.ex{font-size:14px;color:var(--mu);margin-top:8px}
.res{text-align:center;padding:20px;border-radius:10px;margin:16px 0;font-size:18px;font-weight:600}
.res.p{background:var(--okb);color:var(--ok)}.res.f{background:var(--nob);color:var(--no)}
@media(max-width:800px){.wrap{grid-template-columns:1fr}nav{display:flex;overflow-x:auto;gap:4px}nav h4{display:none}.mb{white-space:nowrap;width:auto}main{padding:18px}td:first-child{width:auto}}
</style></head><body>
<header><div class="top"><div class="logo">Curso de <span>Francés</span> 🇫🇷</div><div class="pb"><i id="bar"></i></div><div class="pt" id="pt"></div></div></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<script>
const V=a=>"<table>"+a.map(r=>`<tr><td><button class="sp" data-t="${r[0]}" onclick="say(this.dataset.t)">🔊</button><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("")+"</table>";
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const M=[
{t:"Saludos y presentaciones",s:[
["Saludos básicos","<p>Toca 🔊 para escuchar la pronunciación de cada frase.</p>"+V([["Bonjour","Buenos días / Hola"],["Bonsoir","Buenas noches (al llegar)"],["Salut","Hola / Chao (informal)"],["Au revoir","Adiós"],["À bientôt","Hasta pronto"],["Merci","Gracias"],["S'il vous plaît","Por favor"],["De rien","De nada"]])],
["Presentarse","<p>Frases para conocer a alguien:</p>"+V([["Je m'appelle Ana","Me llamo Ana"],["Comment vous appelez-vous ?","¿Cómo se llama usted?"],["Enchanté","Encantado (ella dice: enchantée)"],["Comment ça va ?","¿Cómo estás?"],["Ça va bien, merci","Estoy bien, gracias"],["Je suis du Venezuela","Soy de Venezuela"]])],
["Tú o usted: tu / vous","<p>El francés tiene dos formas de hablar: <b>tu</b> (informal: amigos, familia, niños) y <b>vous</b> (formal: desconocidos, mayores, trabajo). <b>Vous</b> también es el plural (ustedes).</p><div class='box'>Si dudas, usa <b>vous</b>. Es mejor ser demasiado formal que demasiado informal; la otra persona te dirá si pueden tutearse.</div>"]],
q:[["Bonjour significa…",["Buenas noches","Adiós","Buenos días / Hola","Gracias"],2,"Es el saludo más usado durante el día."],
["Para hablar con un desconocido mayor usas…",["tu","vous","salut","ça va"],1,"Vous es la forma formal."],
["“Comment ça va ?” significa…",["¿Cómo te llamas?","¿Cómo estás?","¿De dónde eres?","¿Qué hora es?"],1,"Es la pregunta habitual para saludar."],
["“De rien” se usa para decir…",["Gracias","Por favor","De nada","Hasta pronto"],2,"Es la respuesta a merci."]]},
{t:"Pronunciación y alfabeto",s:[
["Alfabeto y letras mudas","<p>El alfabeto francés tiene las mismas 26 letras que el español (sin ñ). La gran diferencia: muchas <b>consonantes finales no se pronuncian</b> (petit, Paris, vous), y la <b>h es siempre muda</b> (hôtel, homme).</p>"+V([["petit","pequeño (la t final es muda)"],["Paris","París (la s final es muda)"],["hôtel","hotel (la h es muda)"]])],
["Sonidos clave","<p>Sonidos que no existen en español:</p>"+V([["tu","tú: labios de “u”, pero di “i”"],["vous","ustedes: ou suena como u española"],["chat","gato: ch suena como “sh”"],["je","yo: j suena como “sh” suave"],["montagne","montaña: gn suena como ñ"],["merci beaucoup","muchas gracias: la r es gutural"]])],
["Acentos y enlace","<p>Los acentos cambian el sonido: <b>é</b> (cerrada), <b>è / ê</b> (abierta), <b>à</b>, <b>ç</b> (suena como s: français). </p><div class='box'>Enlace (liaison): una consonante final muda se pronuncia si la siguiente palabra empieza con vocal. <i>vous allez</i> se pronuncia “vu-za-lé”.</div>"+V([["vous allez","ustedes van"],["les amis","los amigos"]])]],
q:[["La letra h en francés es…",["Fuerte como j","Siempre muda","Como ch","Como g"],1,"Ejemplo: hôtel, homme."],
["El grupo “ou” suena como…",["o","u española","i","e"],1,"Vous suena como “vu”."],
["“gn” en montagne suena como…",["ñ","gu","n","ng"],0,"Es el mismo sonido de la ñ."],
["La ç (cedilla) suena como…",["k","s","ch","g"],1,"Français se pronuncia con s."]]},
{t:"Números, días y tiempo",s:[
["Números del 0 al 10","<p>Aprende estos primero:</p>"+V([["zéro","0"],["un","1"],["deux","2"],["trois","3"],["quatre","4"],["cinq","5"],["six","6"],["sept","7"],["huit","8"],["neuf","9"],["dix","10"]])],
["Del 11 en adelante","<p>Hasta 16 son palabras propias; luego se arma como dix-sept (10+7).</p>"+V([["onze","11"],["douze","12"],["quinze","15"],["vingt","20"],["trente","30"],["cinquante","50"],["soixante","60"],["soixante-dix","70 (60 + 10)"],["quatre-vingts","80 (4 × 20)"],["quatre-vingt-dix","90 (4 × 20 + 10)"],["cent","100"]])],
["Días de la semana","<p>En francés los días van en minúscula y empiezan por lundi.</p>"+V([["lundi","lunes"],["mardi","martes"],["mercredi","miércoles"],["jeudi","jueves"],["vendredi","viernes"],["samedi","sábado"],["dimanche","domingo"]])]],
q:[["“soixante-dix” es…",["60","70","80","90"],1,"Soixante (60) + dix (10) = 70."],
["“quatre-vingts” es…",["40","24","80","90"],2,"4 × 20 = 80."],
["“mercredi” es…",["Martes","Miércoles","Jueves","Viernes"],1,"Mercredi = miércoles."],
["“huit” es…",["7","8","9","10"],1,"Huit = 8."]]},
{t:"Los verbos être y avoir",s:[
["Être (ser / estar)","<p>El verbo más importante del francés. Es irregular, hay que memorizarlo:</p>"+V([["je suis","yo soy / estoy"],["tu es","tú eres / estás"],["il / elle est","él / ella es"],["nous sommes","nosotros somos"],["vous êtes","usted(es) es / son"],["ils / elles sont","ellos / ellas son"]])],
["Avoir (tener)","<p>También irregular. Delante de vocal, je se vuelve j':</p>"+V([["j'ai","yo tengo"],["tu as","tú tienes"],["il a","él tiene"],["nous avons","nosotros tenemos"],["vous avez","usted(es) tiene(n)"],["ils ont","ellos tienen"]])+"<div class='box'>Con avoir se dice la edad y sensaciones: <b>J'ai vingt ans</b> (tengo 20 años), <b>J'ai faim</b> (tengo hambre).</div>"],
["Verbos terminados en -er","<p>La mayoría de verbos son regulares en <b>-er</b>. Quita -er y agrega: <b>-e, -es, -e, -ons, -ez, -ent</b>.</p>"+V([["je parle","yo hablo"],["tu parles","tú hablas"],["il parle","él habla"],["nous parlons","hablamos"],["vous parlez","hablan"],["ils parlent","hablan (ellos)"]])+"<p>Las terminaciones -e, -es y -ent no se pronuncian.</p>"]],
q:[["“Nous sommes” significa…",["Somos","Son","Soy","Eres"],0,"Nous = nosotros; sommes es de être."],
["“J'ai vingt-cinq ans” significa…",["Soy de 25","Tengo 25 años","Tengo 25 amigos","Voy a 25"],1,"La edad se dice con avoir."],
["La terminación de “ils parlent” suena…",["Como -ent","Como -ant","Silenciosa","Como -ons"],2,"Parle y parlent suenan igual."],
["“Vous êtes” se traduce…",["Ustedes tienen","Usted es / ustedes son","Yo estoy","Nosotros somos"],1,"Vous êtes = formal o plural."]]},
{t:"Vocabulario cotidiano",s:[
["Familia y personas","<p>Vocabulario básico de la familia:</p>"+V([["la famille","la familia"],["le père","el padre"],["la mère","la madre"],["le frère","el hermano"],["la sœur","la hermana"],["l'ami / l'amie","el amigo / la amiga"]])],
["Comida y bebida","<p>Para pedir algo usa <b>Je voudrais…</b> (Quisiera…), más educado que “je veux”.</p>"+V([["le pain","el pan"],["l'eau","el agua"],["le café","el café"],["le lait","la leche"],["le fromage","el queso"],["Je voudrais un café","Quisiera un café"],["L'addition, s'il vous plaît","La cuenta, por favor"]])],
["Género y artículos","<p>Todo sustantivo es <b>masculino</b> o <b>femenino</b>:</p><p><b>le / la / l'</b> (el, la) · <b>les</b> (los, las)<br><b>un / une</b> (un, una) · <b>des</b> (unos, unas)</p><div class='box'>Delante de vocal o h muda, le y la se convierten en l' (l'eau, l'ami). El plural suele ser +s, pero esa s es muda: <i>le livre → les livres</i> solo cambia el artículo al oído.</div>"]],
q:[["“La mère” significa…",["La madre","El padre","La hermana","La amiga"],0,"Mère = madre."],
["“Je voudrais un café” significa…",["Tengo un café","Quisiera un café","Hago un café","Vendo café"],1,"Je voudrais = quisiera."],
["“Une” es el artículo…",["Masculino indefinido","Femenino indefinido","Plural","Masculino definido"],1,"Une = una."],
["“L'eau” significa…",["La leche","El pan","El agua","El queso"],2,"Eau = agua; l' porque empieza con vocal."]]}
];
M.push({t:"Examen final",s:[["Antes de empezar","<p>Este examen reúne 2 preguntas de cada módulo. Necesitas 70% para aprobar. Puedes repasar las lecciones cuando quieras.</p>"]],q:M.flatMap(m=>m.q.filter((_,i)=>i==1||i==m.q.length-1))});
let S={d:{},v:0,m:"l",i:0};
try{S.d=JSON.parse(localStorage.getItem("fr")||"{}")}catch(e){}
const sv=()=>{try{localStorage.setItem("fr",JSON.stringify(S.d))}catch(e){}};
const $=id=>document.getElementById(id);
function nav(){let n=Object.keys(S.d).filter(k=>S.d[k]>=70).length;
$("nav").innerHTML="<h4>Módulos</h4>"+M.map((m,i)=>`<button class="mb ${i==S.v?"on":""} ${S.d[i]>=70?"done":""}" onclick="go(${i})"><span class="dot">${S.d[i]>=70?"✓":i+1}</span>${m.t}</button>`).join("");
$("bar").style.width=n/M.length*100+"%";$("pt").textContent=n+" de "+M.length+" aprobados"}
function go(i){S.v=i;S.m="l";S.i=0;render()}
function render(){nav();const m=M[S.v],e=$("main");scrollTo(0,0);
if(S.m=="l"){const x=m.s[S.i],last=S.i==m.s.length-1;
e.innerHTML=`<div class="tag">${S.v==M.length-1?"Examen final":"Módulo "+(S.v+1)} · Lección ${S.i+1} de ${m.s.length}</div><h1>${x[0]}</h1>${x[1]}
<div class="row"><button class="btn s" ${S.i?"":"disabled"} onclick="S.i--;render()">← Anterior</button>
<button class="btn" onclick="${last?"S.m='q';render()":"S.i++;render()"}">${last?"Ir al quiz →":"Siguiente →"}</button></div>`}
else quiz(m,e)}
function quiz(m,e){e.innerHTML=`<div class="tag">${S.v==M.length-1?"Examen final":"Módulo "+(S.v+1)} · Quiz</div><h1>${m.t}</h1><p>Responde las ${m.q.length} preguntas. Necesitas 70% o más para aprobar.</p>`+
m.q.map((q,i)=>`<div class="q"><p>${i+1}. ${q[0]}</p>${q[1].map((o,j)=>`<label class="o" id="o${i}_${j}"><input type="radio" name="q${i}" value="${j}">${o}</label>`).join("")}<div class="ex" id="x${i}"></div></div>`).join("")+
`<div id="rs"></div><div class="row"><button class="btn" id="sb" onclick="grade()">Enviar respuestas</button></div>`}
function grade(){const m=M[S.v];let ok=0,miss=0;
m.q.forEach((q,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);if(!c){miss++;return}
const a=+c.value;if(a==q[2])ok++;
q[1].forEach((_,j)=>{const o=$("o"+i+"_"+j);o.querySelector("input").disabled=true;if(j==q[2])o.classList.add("ok");else if(j==a)o.classList.add("no")});
$("x"+i).textContent=(a==q[2]?"✔ Correcto. ":"✘ Incorrecto. ")+q[3]});
if(miss){alert("Responde todas las preguntas antes de enviar.");S.m="q";render();return}
const p=Math.round(ok/m.q.length*100);S.d[S.v]=Math.max(S.d[S.v]||0,p);sv();nav();
const pass=p>=70,nx=S.v<M.length-1;
$("rs").innerHTML=`<div class="res ${pass?"p":"f"}">${pass?"¡Aprobado! ":"Aún no aprobado. "}${ok}/${m.q.length} correctas (${p}%)</div>`;
$("sb").outerHTML=`<button class="btn s" onclick="S.m='l';S.i=0;render()">Repasar lecciones</button><button class="btn s" onclick="S.m='q';render()">Reintentar quiz</button>`+(pass&&nx?`<button class="btn" onclick="go(${S.v+1})">Siguiente →</button>`:"");
$("rs").scrollIntoView({behavior:"smooth",block:"center"})}
render();
</script></body></html>
